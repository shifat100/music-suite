
name: Generate Audio Databases

on:
  push:
    branches:
      - main
    paths:
      - "audio/**"
      - "scripts/generate_db.py"
      - ".github/workflows/generate-db.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate db.json files
        run: python scripts/generate_db.py
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}

      - name: Commit generated databases
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add audio/
          if ! git diff --cached --quiet; then
            git commit -m "chore: update audio databases"
            git push
          else
            echo "No database changes to commit."
          fi
